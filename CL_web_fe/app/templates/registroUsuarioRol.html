<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registrar Usuario</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f1f1f1;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 600px;
      margin: 60px auto;
      padding: 30px;
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      position: relative;
    }

    .container img {
      display: block;
      margin: 0 auto 20px;
      max-width: 120px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    h3 {
      color: #333;
      border-bottom: 2px solid #00b894;
      padding-bottom: 5px;
      margin-top: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 8px 12px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .form-row {
      display: flex;
      gap: 15px;
    }

    .form-row > div {
      flex: 1;
    }

    .hidden {
      display: none;
    }

    .button {
      margin-top: 20px;
      width: 100%;
      background-color: #00b894;
      border: none;
      color: white;
      font-size: 16px;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    .button:hover {
      background-color: #019875;
    }

    #mensaje {
      margin-top: 20px;
      padding: 15px;
      text-align: center;
      border-radius: 8px;
    }

    #mensaje.exito {
      background-color: #dff0d8;
      color: #3c763d;
    }

    #mensaje.error {
      background-color: #f8d7da;
      color: #721c24;
    }

    #cargando {
      display: none;
      text-align: center;
      margin-top: 20px;
    }

    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #00b894;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="../static/img/Colive_Logo_.png" alt="Colive Logo">
    <h2>Registrar Usuario</h2>

    <label for="rol">Tipo de usuario</label>
    <select id="rol" required>
      <option value="">Cargando roles...</option>
    </select>

    <!-- Datos de la propiedad (solo para propietarios) -->
    <div id="datos-propiedad" class="hidden">
      <h3>📍 Datos de la Propiedad</h3>
      
      <label for="descripcionApartamento">Descripción del apartamento *</label>
      <input type="text" id="descripcionApartamento" placeholder="Ej: Torre 1 Apto 303" required>

      <div class="form-row">
        <div>
          <label for="numeroParqueadero">Número de parqueadero</label>
          <input type="number" id="numeroParqueadero" placeholder="Ej: 12">
        </div>
        <div>
          <label for="numeroBodega">Número de bodega</label>
          <input type="number" id="numeroBodega" placeholder="Ej: 7">
        </div>
      </div>
    </div>

    <!-- Datos del usuario (para todos los roles) -->
    <div id="datos-usuario" class="hidden">
      <h3>👤 Datos del Usuario</h3>
      
      <div class="form-row">
        <div>
          <label for="nombreUsuario">Nombre completo *</label>
          <input type="text" id="nombreUsuario" placeholder="Ej: Juan Pérez" required>
        </div>
        <div>
          <label for="emailUsuario">Correo electrónico *</label>
          <input type="email" id="emailUsuario" placeholder="Ej: juan@email.com" required>
        </div>
      </div>

      <div class="form-row">
        <div>
          <label for="usernameUsuario">Nombre de usuario *</label>
          <input type="text" id="usernameUsuario" placeholder="Se genera automáticamente" readonly>
        </div>
        <div>
          <label for="celularUsuario">Celular</label>
          <input type="tel" id="celularUsuario" placeholder="Ej: 3001234567">
        </div>
      </div>

      <div class="form-row">
        <div>
          <label for="passwordUsuario">Contraseña *</label>
          <input type="password" id="passwordUsuario" placeholder="Mínimo 8 caracteres" required>
        </div>
        <div>
          <label for="confirmPasswordUsuario">Confirmar contraseña *</label>
          <input type="password" id="confirmPasswordUsuario" placeholder="Repetir contraseña" required>
        </div>
      </div>
    </div>

    <button class="button" onclick="registrarUsuario()">Registrar Usuario</button>

    <div id="cargando"><div class="spinner"></div><p>Procesando...</p></div>
    <div id="mensaje" class="hidden"></div>
  </div>

  <script>
    const rolSelect = document.getElementById('rol');
    const datosPropiedad = document.getElementById('datos-propiedad');
    const datosUsuario = document.getElementById('datos-usuario');
    const mensaje = document.getElementById('mensaje');
    const cargando = document.getElementById('cargando');
    const emailUsuario = document.getElementById('emailUsuario');
    const usernameUsuario = document.getElementById('usernameUsuario');

    // Cargar roles desde backend
    async function cargarRoles() {
      try {
         const roles = [
            { id: 2, nombre: 'PROPIEDAD_CR', display: 'Propietario/Residente' },
            { id: 4, nombre: 'SEGURIDAD_CR', display: 'Seguridad' },
            { id: 5, nombre: 'MANTENIMIENTO_CR', display: 'Mantenimiento' },
            { id: 6, nombre: 'ASEO_CR', display: 'Aseo' }
        ];

        rolSelect.innerHTML = '<option value="">Selecciona un tipo</option>';
        for (let rol of roles) {
          const option = document.createElement('option');
          option.value = rol.nombre;
          option.textContent = rol.display;
          rolSelect.appendChild(option);
        }
      } catch (err) {
        rolSelect.innerHTML = '<option value="">Error al cargar roles</option>';
        console.error('Error cargando roles:', err);
      }
    }

    // Mostrar/ocultar secciones según el rol
    rolSelect.addEventListener('change', () => {
      const rol = rolSelect.value;
      if (rol) {
        datosUsuario.classList.remove('hidden');
        datosPropiedad.classList.toggle('hidden', rol !== 'PROPIEDAD_CR');
      } else {
        datosUsuario.classList.add('hidden');
        datosPropiedad.classList.add('hidden');
      }
    });

    // Generar username automáticamente desde el email
    emailUsuario.addEventListener('input', () => {
      const email = emailUsuario.value.trim();
      if (email && email.includes('@')) {
        const username = email.split('@')[0];
        usernameUsuario.value = username;
      } else {
        usernameUsuario.value = '';
      }
    });

    async function registrarUsuario() {
      const rol = rolSelect.value;

      if (!rol) {
        mostrarMensaje('Por favor selecciona un tipo de usuario.', false);
        return;
      }

      // Validar campos comunes
      const nombreUsuario = document.getElementById('nombreUsuario').value.trim();
      const emailUsuario = document.getElementById('emailUsuario').value.trim();
      const usernameUsuario = document.getElementById('usernameUsuario').value.trim();
      const passwordUsuario = document.getElementById('passwordUsuario').value;
      const confirmPasswordUsuario = document.getElementById('confirmPasswordUsuario').value;
      const celularUsuario = document.getElementById('celularUsuario').value.trim();

      if (!nombreUsuario || !emailUsuario || !usernameUsuario || !passwordUsuario) {
        mostrarMensaje('Por favor completa todos los campos obligatorios (*).', false);
        return;
      }

      if (passwordUsuario !== confirmPasswordUsuario) {
        mostrarMensaje('Las contraseñas no coinciden.', false);
        return;
      }

      if (passwordUsuario.length < 8) {
        mostrarMensaje('La contraseña debe tener al menos 8 caracteres.', false);
        return;
      }

      mostrarCargando(true);
      mensaje.classList.add('hidden');

      try {
        if (rol === 'PROPIEDAD_CR') {
          // Validar campos específicos de propiedad
          const descripcionApartamento = document.getElementById('descripcionApartamento').value.trim();
          if (!descripcionApartamento) {
            mostrarMensaje('Por favor completa la descripción del apartamento.', false);
            return;
          }

          const numeroParqueadero = document.getElementById('numeroParqueadero').value;
          const numeroBodega = document.getElementById('numeroBodega').value;

          const data = {
            residence: {
              code: descripcionApartamento
            },
            user: {
              nombre: nombreUsuario,
              correo: emailUsuario,
              username: usernameUsuario,
              password: passwordUsuario,
              celular: celularUsuario || '0',
              rol: 'PROPIEDAD_CR'
            }
          };

          // Agregar parqueadero si tiene valor
          if (numeroParqueadero && numeroParqueadero.trim() !== '') {
            const parqueaderoNum = parseInt(numeroParqueadero);
            if (!isNaN(parqueaderoNum)) {
              data.residence.parqueadero = parqueaderoNum;
            }
          }

          // Agregar bodega si tiene valor
          if (numeroBodega && numeroBodega.trim() !== '') {
            const bodegaNum = parseInt(numeroBodega);
            if (!isNaN(bodegaNum)) {
              data.residence.bodega = bodegaNum;
            }
          }

          const res = await fetch('/fe-api/crear-usuario-propiedad', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify(data)
          });

          if (!res.ok) {
            const errorData = await res.json();
            throw new Error(errorData.error || 'Error en la creación');
          }

          const result = await res.json();
          
          if (result.success) {
            mostrarMensaje(`¡Usuario y propiedad registrados exitosamente!<br>Propiedad: ${result.residence.code}<br>Usuario: ${result.user.username}`, true);
            limpiarFormulario();
          } else {
            throw new Error(result.message || 'Error desconocido');
          }

        } else {
          // Para otros roles (seguridad, mantenimiento, aseo)
          const data = {
            nombre: nombreUsuario,
            correo: emailUsuario,
            username: usernameUsuario,
            password: passwordUsuario,
            celular: celularUsuario || '0',
            rol: rol
          };

          const res = await fetch('/fe-api/crear-usuario-rol', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify(data)
          });

          if (!res.ok) {
            const errorData = await res.json();
            throw new Error(errorData.error || 'Error en la creación');
          }

          const result = await res.json();
          
          if (result.success) {
            mostrarMensaje(`¡Usuario ${rol.replace('_CR', '')} registrado exitosamente!<br>Usuario: ${result.user.username}`, true);
            limpiarFormulario();
          } else {
            throw new Error(result.message || 'Error desconocido');
          }
        }
        
      } catch (err) {
        console.error('Error:', err);
        mostrarMensaje(`Error al registrar: ${err.message}`, false);
      } finally {
        mostrarCargando(false);
      }
    }

    function limpiarFormulario() {
      // Limpiar campos de propiedad
      document.getElementById('descripcionApartamento').value = '';
      document.getElementById('numeroParqueadero').value = '';
      document.getElementById('numeroBodega').value = '';
      
      // Limpiar campos de usuario
      document.getElementById('nombreUsuario').value = '';
      document.getElementById('emailUsuario').value = '';
      document.getElementById('usernameUsuario').value = '';
      document.getElementById('passwordUsuario').value = '';
      document.getElementById('confirmPasswordUsuario').value = '';
      document.getElementById('celularUsuario').value = '';
      
      // Resetear selección
      rolSelect.value = '';
      datosUsuario.classList.add('hidden');
      datosPropiedad.classList.add('hidden');
    }

    function mostrarMensaje(msg, exito) {
      mensaje.classList.remove('hidden', 'exito', 'error');
      mensaje.classList.add(exito ? 'exito' : 'error');
      mensaje.innerHTML = msg;
    }

    function mostrarCargando(estado) {
      cargando.style.display = estado ? 'block' : 'none';
    }

    cargarRoles();
  </script>
</body>
</html>
