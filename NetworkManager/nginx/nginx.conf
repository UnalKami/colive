events {}

http {
    # Definir el upstream para load balancing de la API de Spring Boot
    upstream auth_backend {
        server CL_Auth_ms1:8080;
        server CL_Auth_ms2:8080;
        server CL_Auth_ms3:8080;
    }

    # Definir el upstream para la API de Node.js
    upstream Residence_backend {
        server CL_residence_ms:3001;
    }

    # Definir el upstream para la API de mensajería
    upstream Message_backend {
        server CL_messaging-ms:7000;
    }

    # definir el upstream para la API de estadísticas
    #upstream Statistics_backend {
    #    server CL_statistics_ms:8001;
    #}

    # Definir el upstream para el frontend
    upstream Web_fe {
        server CL_web_fe:5000;
    }

    # redirección de HTTP a HTTPS
    server {
        listen 80;
        server_name localhost;

        return 301 https://$host$request_uri;
    }
    
    # Configuración del servidor HTTPS
    server {
        listen 443 ssl;
        server_name localhost;
        # Configuración de SSL
        ssl_certificate /etc/nginx/certs/ssl.crt;
        ssl_certificate_key /etc/nginx/certs/ssl.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Proxy para el frontend
        location / {
            proxy_pass http://Web_fe;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }

    #auth_backend server
    server {
        listen 8080 ssl;
        server_name localhost;

        # Configuración de SSL
        ssl_certificate /etc/nginx/certs/ssl.crt;
        ssl_certificate_key /etc/nginx/certs/ssl.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        
        location / {
            proxy_pass http://auth_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # Residence_backend server
    server {
        listen 3001 ssl;
        server_name localhost;
        # Configuración de SSL
        ssl_certificate /etc/nginx/certs/ssl.crt;
        ssl_certificate_key /etc/nginx/certs/ssl.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://Residence_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # Message_backend server
    server {
        listen 7000 ssl;
        server_name localhost;
        # Configuración de SSL
        ssl_certificate /etc/nginx/certs/ssl.crt;
        ssl_certificate_key /etc/nginx/certs/ssl.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Proxy para la API de mensajería
        location / {
            proxy_pass http://Message_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

    }
    # Statistics_backend server
    #server {
    #    listen 8001 ssl;
    #    server_name localhost;
    #    # Configuración de SSL
    #    ssl_certificate /etc/nginx/certs/ssl.crt;
    #    ssl_certificate_key /etc/nginx/certs/ssl.key;
    #    ssl_protocols TLSv1.2 TLSv1.3;
    #    # Proxy para la API de estadísticas
    #    location / {
    #        proxy_pass http://Statistics_backend;
    #        proxy_http_version 1.1;
    #        proxy_set_header Upgrade $http_upgrade;
    #        proxy_set_header Connection 'upgrade';
    #        proxy_set_header Host $host;
    #        proxy_cache_bypass $http_upgrade;
    #    }
}