events {}

http {
    # Definir el upstream para load balancing de auth services
    upstream auth_backend {
        server CL_Auth_ms1:8080;
        server CL_Auth_ms2:8080;
        server CL_Auth_ms3:8080;
        # Opcional: configurar método de balanceo
        # least_conn; # Para distribución por menor conexiones
        # ip_hash;    # Para mantener sesiones por IP
    }

    server {
        listen 80;
        server_name localhost;

        # Proxy para la API de Spring Boot con load balancing
        location /auth {
            proxy_pass http://auth_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
        
        # Proxy para la API de Node.js
        location /api {
            proxy_pass http://CL_residence-ms:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Proxy para la Mensajería de Scala
        location /msg {
            proxy_pass http://CL_messaging-ms:7000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}