events {}

http {
     # Definir el upstream para load balancing de las réplicas de CL_Auth_ms
    upstream CL_auth_lb {
        server CL-auth-ms1:8080;
        server CL-auth-ms2:8080;
        server CL-auth-ms3:8080;
    }

    server {
        listen 8080;
        server_name localhost;        

        # Proxy para las réplicas de CL_Auth_ms
        location / {
            proxy_pass http://CL_auth_lb;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host CL-auth-lb;
            proxy_cache_bypass $http_upgrade;
        }
    }
}