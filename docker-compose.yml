networks:
  private-network:
    driver: bridge    
  public-network:
    driver: bridge 

volumes:
  cl-auth-db-data:
  cl-residence-db-data:
  cl-messaging-db-data:
  pg-guest-data:
  
services:

  # RED PÚBLICA # (Accesibles desde internet)
  cl-web-rp:
   image: nginx:1.28.0-alpine-perl
   container_name: cl-web-rp
   ports:
       - "80:80"
       - "443:443"
   volumes:
     - ./CL_web_rp/nginx:/etc/nginx
     - ./CL_web_rp/nginx/ssl:/etc/nginx/ssl
   depends_on:
     - cl-web-fe
   networks:
      - public-network
      - private-network

  cl-desktop-rp:
   image: nginx:1.28.0-alpine-perl
   container_name: cl-desktop-rp
   ports:
       - "8080:8080"
       - "8443:8443"
   volumes:
     - ./CL_desktop_rp/nginx:/etc/nginx
     - ./CL_desktop_rp/nginx/ssl:/etc/nginx/ssl
   depends_on:     
     - cl-ag
   networks:
      - public-network
      - private-network 

  # RED PRIVADA# (No accesibles desde internet)

  # PRESENTACION #

  cl-web-fe:
    image: cl-web-fe:latest
    build: 
      context: ./CL_web_fe     
    container_name: cl-web-fe
    # ports:
    #   - "5000:5000"
    environment:
      - FLASK_ENV=development
    restart: unless-stopped
    volumes:
      - ./JWT_public.key.pub:/run/secrets/JWT_public.key.pub:ro
    networks:
      - private-network
  
  # COMUNICACIÖN #

  cl-ag:
    image: cl-ag:latest
    build:
      context: ./CL_ag
    container_name: cl-ag
    #ports:
    #  - "8000:8000"
    volumes:
      - ./JWT_public.key.pub:/run/secrets/JWT_public.key.pub:ro
    networks:
      - private-network

  cl-auth-lb:
    image: nginx:1.28.0-alpine-perl
    container_name: cl-auth-lb   
    volumes:
      - ./CL_auth_lb/nginx:/etc/nginx
    depends_on:
      - cl-auth-ms1
      - cl-auth-ms2
      - cl-auth-ms3
    networks: 
        - private-network
  
  # LÓGICA #

  cl-auth-ms1:
    image: openjdk:24-slim-bookworm
    container_name: cl-auth-ms1
    hostname: cl-auth-ms1
    build:
      context: ./auth-java-component  
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://cl-auth-db:5432/db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=cincopatodos      
    volumes:
      - ./JWT_private.key:/run/secrets/JWT_private.key:ro
      - ./JWT_public.key.pub:/run/secrets/JWT_public.key.pub:ro
    depends_on:
      - cl-auth-db
    networks:
      - private-network

  cl-auth-ms2:
    image: openjdk:24-slim-bookworm
    container_name: cl-auth-ms2
    hostname: cl-auth-ms2
    build:
      context: ./auth-java-component
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://cl-auth-db:5432/db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=cincopatodos
    volumes:
      - ./JWT_private.key:/run/secrets/JWT_private.key:ro
      - ./JWT_public.key.pub:/run/secrets/JWT_public.key.pub:ro
    networks:
      - private-network
    depends_on:
      - cl-auth-db

  cl-auth-ms3:
    image: openjdk:24-slim-bookworm
    container_name: cl-auth-ms3
    hostname: cl-auth-ms3
    build:
      context: ./auth-java-component
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://cl-auth-db:5432/db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=cincopatodos
    volumes:
      - ./JWT_private.key:/run/secrets/JWT_private.key:ro
      - ./JWT_public.key.pub:/run/secrets/JWT_public.key.pub:ro
    networks:
      - private-network
    depends_on:
      - cl-auth-db

  cl-residence-ms:
    image: conjunto-residencial-cl-residence-ms
    container_name: cl-residence-ms
    build:
      context: ./ResidenceCreator-ms  
    #ports:
    #   - "3001:3001"
    depends_on:
      - cl-residence-db
      - cl-guest-db
    env_file:
      - ./ResidenceCreator-ms/.env
    networks:
      - private-network

  cl-messaging-ms:
    image: cl-messaging-ms:latest
    build:
      context: ./MensajeriaYnotificaciones
      dockerfile: Dockerfile.sbt-alpine
    container_name: cl-messaging-ms
    #ports:
    #  - "7000:7000"
    environment:
      SMTP_SECRET_KEY: "claveaes12345678" # Clave AES de 16 bytes
      MONGO_URI: "mongodb://root:cincopatodos@cl-messaging-db:27017/correos?authSource=admin"
    command: ["sbt", "run"]
    depends_on:
      - cl-messaging-db
    restart: unless-stopped
    networks:
      - private-network

  cl-stadistics-ms:
    image: cl-stadistics-ms:latest
    build: ./stadistics
    #image: conjunto-residencial-cl-stadistics-ms
    container_name: stadistics
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./stadistics:/app
    #ports:
    #  - "8010:8010"
      - cl-web-fe
    #env_file:
    #  - ./stadistics/.env
    depends_on:
      - cl-ag
      - cl-residence-ms
      - cl-auth-db
      - cl-residence-db
    environment:
      - POSTGRES_HOST=cl-auth-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=cincopatodos
    # …
    networks:
      - private-network

# DATOS #

  cl-auth-db:
    container_name: cl-auth-db
    #ports:
    #  - 5432:5432
    image: postgres:16.9-alpine3.21 
    restart: unless-stopped
    environment:
      - POSTGRES_DB=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=cincopatodos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - cl-auth-db-data:/var/lib/postgresql/data
    networks:
      - private-network

  cl-residence-db:
    image: mongo:8.0.9-noble
    container_name: cl-residence-db
    #ports:
    #  - "27017:27017" 
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=cincopatodos
      - MONGO_INITDB_DATABASE=residence_db
    volumes:
      - cl-residence-db-data:/data/db
    networks:
      - private-network

  cl-messaging-db:
    image: mongo:8.0.9-noble
    container_name: cl-messaging-db
    #ports:
    #  - "27018:27017" 
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=cincopatodos
      - MONGO_INITDB_DATABASE=messaging_db
    volumes:
      - cl-messaging-db-data:/data/db
    networks:
      - private-network

  cl-guest-db:
    container_name: cl-guest-db
    #ports:
    #  - 5433:5432
    image: postgres:16.9-alpine3.21 
    restart: unless-stopped
    environment:
      - POSTGRES_DB=db2
      - POSTGRES_USER=postgres2
      - POSTGRES_PASSWORD=cincopatodos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres2 -d db2"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pg-guest-data:/var/lib/postgresql/data
    networks:
      - private-network
      
